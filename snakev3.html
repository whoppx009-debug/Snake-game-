<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Snake </title>
<style>
  :root{
    --bg: #0b0f14;
    --panel: #11161d;
    --grid: #1a2028;
    --amber: #ffb347;
    --amber-dim: #6b4a1e;
    --cyan: #46e0c8;
    --red: #ff5c5c;
    --ink: #d7dee6;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Courier New', ui-monospace, monospace;
    display:flex; align-items:center; justify-content:center;
  }
  .cabinet{
    display:flex; flex-direction:column; align-items:center;
    gap:14px; padding:18px 22px 24px;
    background: linear-gradient(180deg,#141a22,#0e1319);
    border-radius:18px;
    box-shadow: 0 0 0 2px #232b34, 0 20px 60px rgba(0,0,0,.6), inset 0 0 40px rgba(70,224,200,.03);
  }
  .brand{
    display:flex; align-items:baseline; justify-content:space-between;
    width:100%;
  }
  .brand h1{
    margin:0; font-size:15px; letter-spacing:5px; color:var(--amber);
    text-shadow: 0 0 8px rgba(255,179,71,.5);
  }
  .brand .tag{ font-size:9px; letter-spacing:2px; color:#5a6572; }
  .hud{
    display:flex; justify-content:space-between; width:100%;
    font-size:12px; letter-spacing:2px; color:var(--cyan);
    padding: 0 2px;
  }
  .hud .best{ color: var(--amber); }
  .screen{
    position:relative;
    background: var(--panel);
    border-radius:6px;
    box-shadow: inset 0 0 30px rgba(0,0,0,.7), inset 0 0 0 1px #232b34;
    padding:8px;
  }
  canvas{
    display:block;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/20px 20px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/20px 20px,
      #0d1218;
    border-radius:2px;
  }
  .overlay{
    position:absolute; inset:8px; border-radius:2px;
    display:flex; align-items:center; justify-content:center;
    background: rgba(6,9,13,.86);
    text-align:center; padding:16px;
    opacity:1; transition: opacity .25s ease;
  }
  .overlay.hidden{ opacity:0; pointer-events:none; }
  .overlay h2{ margin:0 0 8px; letter-spacing:4px; font-size:18px; color:var(--amber); }
  .overlay p{ margin:2px 0; font-size:12px; color:#9aa7b3; letter-spacing:1px; }
  .overlay .go{ color: var(--red); }
  .keys{
    display:flex; gap:6px; margin-top:12px; justify-content:center;
  }
  kbd{
    background:#1c232c; border:1px solid #2c3542; border-radius:4px;
    padding:3px 7px; font-size:11px; color:var(--ink);
    box-shadow: 0 2px 0 #0a0d11;
  }
  .footer{
    display:flex; gap:16px; font-size:10px; letter-spacing:1.5px; color:#4b5661;
  }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--red); display:inline-block; margin-right:5px; box-shadow:0 0 6px var(--red); }
</style>
</head>
<body>

<div class="cabinet">
  <div class="brand">
    <h1>SNAKE</h1>
    <span class="tag">V.1</span>
  </div>

  <div class="hud">
    <span>PUNTOS <b id="score">000</b></span>
    <span class="best">MEJOR <b id="best">000</b></span>
  </div>

  <div class="screen">
    <canvas id="game" width="320" height="320"></canvas>
    <div class="overlay" id="overlay">
      <div>
        <h2 id="ov-title">SNAKE</h2>
        <p id="ov-sub">Come, crece y no te muerdas la cola.</p>
        <p class="go" id="ov-score" style="display:none;"></p>
        <div class="keys">
          <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd>
          <span style="width:8px;"></span>
          <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
        </div>
        <p style="margin-top:10px;">ESPACIO para empezar</p>
      </div>
    </div>
  </div>

  <div class="footer">
    <span><span class="dot"></span>ESPACIO inicia</span>
    <span>doble ESPACIO reinicia</span>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const cell = 20;
  const cols = canvas.width / cell;
  const rows = canvas.height / cell;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovSub = document.getElementById('ov-sub');
  const ovScore = document.getElementById('ov-score');

  let best = Number(localStorage.getItem('vibora_best') || 0);
  bestEl.textContent = String(best).padStart(3,'0');

  let snake, dir, nextDir, food, score, speedMs, timer, running, paused, started;

  function resetGame(){
    snake = [
      {x: 5, y: Math.floor(rows/2)},
      {x: 4, y: Math.floor(rows/2)},
      {x: 3, y: Math.floor(rows/2)},
    ];
    dir = {x:1, y:0};
    nextDir = {x:1, y:0};
    score = 0;
    speedMs = 140;
    running = false;
    paused = false;
    started = false;
    placeFood();
    scoreEl.textContent = '000';
    draw();
  }

  function placeFood(){
    let ok = false;
    while(!ok){
      food = { x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows) };
      ok = !snake.some(s => s.x===food.x && s.y===food.y);
    }
  }

  function showOverlay(title, sub, showScore){
    ovTitle.textContent = title;
    ovSub.textContent = sub;
    if(showScore){
      ovScore.style.display = 'block';
      ovScore.textContent = 'puntaje: ' + String(score).padStart(3,'0') + (score >= best ? '  ¡nuevo mejor!' : '');
    } else {
      ovScore.style.display = 'none';
    }
    overlay.classList.remove('hidden');
  }
  function hideOverlay(){ overlay.classList.add('hidden'); }

  function loop(){
    if(!running || paused) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // choque contra bordes
    if(head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows){
      return gameOver();
    }
    // choque contra el cuerpo
    if(snake.some(s => s.x===head.x && s.y===head.y)){
      return gameOver();
    }

    snake.unshift(head);

    if(head.x === food.x && head.y === food.y){
      score++;
      scoreEl.textContent = String(score).padStart(3,'0');
      placeFood();
      if(speedMs > 64) speedMs -= 3;
      clearInterval(timer);
      timer = setInterval(loop, speedMs);
    } else {
      snake.pop();
    }

    draw();
  }

  function gameOver(){
    running = false;
    clearInterval(timer);
    if(score > best){
      best = score;
      localStorage.setItem('vibora_best', String(best));
      bestEl.textContent = String(best).padStart(3,'0');
    }
    showOverlay('PERDISTE', 'chocaste feo. reiniciando...', true);
    draw();
    setTimeout(hardReset, 1400);
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width, canvas.height);

    // comida
    ctx.fillStyle = '#ff5c5c';
    ctx.shadowColor = '#ff5c5c';
    ctx.shadowBlur = 10;
    roundRect(food.x*cell+4, food.y*cell+4, cell-8, cell-8, 4);
    ctx.fill();
    ctx.shadowBlur = 0;

    // serpiente
    snake.forEach((s, i) => {
      const t = i / Math.max(1, snake.length-1);
      if(i === 0){
        ctx.fillStyle = '#ffe9c2';
        ctx.shadowColor = '#46e0c8';
        ctx.shadowBlur = 8;
      } else {
        const g = 224 - Math.floor(t*90);
        ctx.fillStyle = `rgb(${40}, ${g}, ${Math.floor(200 - t*80)})`;
        ctx.shadowBlur = 0;
      }
      roundRect(s.x*cell+1.5, s.y*cell+1.5, cell-3, cell-3, 5);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function setDir(x,y){
    if(dir.x === -x && dir.y === -y) return; // no giro de 180°
    nextDir = {x,y};
  }

  function startIfNeeded(){
    if(started) return;
    started = true;
    running = true;
    hideOverlay();
    clearInterval(timer);
    timer = setInterval(loop, speedMs);
  }

  let lastSpaceTime = 0;
  const DOUBLE_SPACE_MS = 400;

  function hardReset(){
    clearInterval(timer);
    resetGame();
    showOverlay('VÍBORA', 'Comé, crecé, no te mordás la cola.', false);
  }

  function handleSpace(){
    const now = performance.now();
    if(now - lastSpaceTime <= DOUBLE_SPACE_MS){
      lastSpaceTime = 0;
      hardReset();
    } else {
      lastSpaceTime = now;
      startIfNeeded();
    }
  }

  window.addEventListener('keydown', (e) => {
    const k = e.key;
    const moveKeys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D'];
    if(moveKeys.includes(k) || k === ' ') e.preventDefault();

    if(k === 'r' || k === 'R'){
      hardReset();
      return;
    }

    if(k === ' '){
      handleSpace();
      return;
    }

    if(!started) return;

    if(k === 'ArrowUp' || k === 'w' || k === 'W') setDir(0,-1);
    else if(k === 'ArrowDown' || k === 's' || k === 'S') setDir(0,1);
    else if(k === 'ArrowLeft' || k === 'a' || k === 'A') setDir(-1,0);
    else if(k === 'ArrowRight' || k === 'd' || k === 'D') setDir(1,0);
  });

  // soporte táctil simple: swipe
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, {passive:true});
  canvas.addEventListener('touchend', (e) => {
    if(!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if(Math.abs(dx) > Math.abs(dy)){
      setDir(dx > 0 ? 1 : -1, 0);
    } else {
      setDir(0, dy > 0 ? 1 : -1);
    }
    startIfNeeded();
    touchStart = null;
  }, {passive:true});

  resetGame();
})();
</script>

</body>
</html>
